# DeviceVault - nginx site configuration (Linux)
#
# Serves the built React frontend and reverse-proxies the FastAPI backend
# (uvicorn listening on 127.0.0.1:8000) under the same origin.
#
# Install:
#   sudo cp deploy/nginx/devicevault.conf /etc/nginx/sites-available/devicevault
#   sudo ln -s /etc/nginx/sites-available/devicevault /etc/nginx/sites-enabled/devicevault
#   sudo nginx -t && sudo systemctl reload nginx

upstream devicevault_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Brute-force protection for sign-in: 10 attempts per minute per client IP
limit_req_zone $binary_remote_addr zone=devicevault_login:10m rate=10r/m;

# Swagger UI (/docs) loads its assets from a CDN, so it gets no CSP; everything else does
map $uri $devicevault_csp {
    /docs   "";
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain, e.g. inventory.example.com

    root /opt/devicevault/frontend/dist;
    index index.html;

    server_tokens off;

    # CSV imports
    client_max_body_size 10m;

    # Security headers. Note: nginx only inherits add_header into locations that
    # define no add_header of their own, so locations below use "expires" for caching.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $devicevault_csp always;
    # After enabling HTTPS, also add:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /api/auth/login {
        limit_req zone=devicevault_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://devicevault_api;
    }

    # REST API
    location /api/ {
        proxy_pass http://devicevault_api;
    }

    location = /health {
        proxy_pass http://devicevault_api;
        access_log off;
    }

    # Interactive API docs (remove these two blocks to hide them in production)
    location = /docs         { proxy_pass http://devicevault_api; }
    location = /openapi.json { proxy_pass http://devicevault_api; }

    # Fingerprinted build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html for React Router
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
