# DeviceVault - standalone nginx configuration for Windows.
#
# Started by start-production.bat with the repository root as nginx's prefix:
#   nginx.exe -p <repo>\ -c deploy/windows/nginx.conf
# so every relative path below resolves against the repository root.

worker_processes  1;
pid        deploy/windows/runtime/nginx.pid;
error_log  deploy/windows/runtime/error.log warn;

events {
    worker_connections  1024;
}

http {
    types {
        text/html                 html htm;
        text/css                  css;
        text/csv                  csv;
        text/plain                txt;
        application/javascript    js mjs;
        application/json          json;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/x-icon              ico;
        font/woff2                woff2;
    }
    default_type  application/octet-stream;

    access_log  deploy/windows/runtime/access.log;
    client_body_temp_path  deploy/windows/runtime/client_body;
    proxy_temp_path        deploy/windows/runtime/proxy;
    fastcgi_temp_path      deploy/windows/runtime/fastcgi;
    uwsgi_temp_path        deploy/windows/runtime/uwsgi;
    scgi_temp_path         deploy/windows/runtime/scgi;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    gzip               on;
    gzip_types         text/plain text/css application/javascript application/json image/svg+xml;

    upstream devicevault_api {
        server 127.0.0.1:8000;
    }

    # Brute-force protection for sign-in: 10 attempts per minute per client IP
    limit_req_zone $binary_remote_addr zone=devicevault_login:10m rate=10r/m;

    # Swagger UI (/docs) loads its assets from a CDN, so it gets no CSP; everything else does
    map $uri $devicevault_csp {
        /docs   "";
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    }

    server {
        listen       8080;
        server_name  localhost;

        root   frontend/dist;
        index  index.html;

        client_max_body_size 10m;

        # Locations below must not use add_header, or they stop inheriting these
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $devicevault_csp always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        location = /api/auth/login {
            limit_req zone=devicevault_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://devicevault_api;
        }

        location /api/                { proxy_pass http://devicevault_api; }
        location = /health            { proxy_pass http://devicevault_api; }
        location = /docs              { proxy_pass http://devicevault_api; }
        location = /openapi.json      { proxy_pass http://devicevault_api; }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
